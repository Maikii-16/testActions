name: Compile

on:
  push:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem paquets
        run: pip install pyinstaller

      - name: Empaquetem el executable
        run: pyinstaller --onefile comprova_desplegaments.py

      - name: Organitzar ftxers
        run: |
          mkdir -p dist-linux
          cp dist/comprova_desplegaments dist-linux/
          cp comprova_desplegaments.spec dist-linux/

      - name: Guardem executable Linux
        uses: actions/upload-artifact@v4
        with:
          name: executable-Linux
          path: dist-linux/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem paquets
        run: pip install pyinstaller

      - name: Empaquetem el executable
        run: pyinstaller --onefile comprova_desplegaments.py

      - name: Organitzar fitxers
        run: |
          mkdir -p dist-win
          cp dist/comprova_desplegaments.exe dist-win/
          cp comprova_desplegaments.spec dist-win/

      - name: Guardem executable Windows
        uses: actions/upload-artifact@v4
        with:
          name: executable-Windows
          path: dist-win/

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem paquets
        run: pip install pyinstaller

      - name: Empaquetem el executable
        run: pyinstaller --onefile comprova_desplegaments.py

      - name: Organitzar fitxers
        run: |
          mkdir -p dist-mac
          cp dist/comprova_desplegaments dist-mac/
          cp comprova_desplegaments.spec dist-mac/

      - name: Guardem executable macOS
        uses: actions/upload-artifact@v4
        with:
          name: executable-macOS
          path: dist-mac/
