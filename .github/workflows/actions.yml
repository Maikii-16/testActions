name: Compile

on:
  push:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem paquets
        run: pip install pyinstaller

      - name: Empaquetem el executable
        run: pyinstaller --onefile comprova_desplegaments.py

      - name: Guardem executable Linux
        uses: actions/upload-artifact@v4
        with:
          name: executable-Linux
          path: |
            dist-linux/comprova_desplegaments
            dist-linux/comprova-desplegaments.spec

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem paquets
        run: pip install pyinstaller

      - name: Empaquetem el executable
        run: pyinstaller --onefile comprova_desplegaments.py

      - name: Guardem executable Windows
        uses: actions/upload-artifact@v4
        with:
          name: executable-Windows
          path: |
            dist-win/comprova_desplegaments.exe
            dist-win/comprova_desplegaments.spec

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem paquets
        run: pip install pyinstaller

      - name: Empaquetem el executable
        run: pyinstaller --onefile comprova_desplegaments.py

      - name: Guardem executable macOS
        uses: actions/upload-artifact@v4
        with:
          name: executable-macOS
          path: |
            dist-mac/comprova_desplegaments
            dist-mac/comprova_desplegaments.spec
